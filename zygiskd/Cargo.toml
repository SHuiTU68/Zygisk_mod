[package]
name = "zygiskd"
authors = ["Nullptr"]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
android_logger = "0.15"
anyhow = { version = "1.0", features = ["backtrace"] }
bitflags = "2.9"
libc = "0.2"
log = "0.4"
memfd = "0.6"
num_enum = "0.7"
passfd = "0.1"

rustix = { version = "1.1", features = [ "fs", "process", "mount", "net", "thread" ] }

[profile.dev]
strip = false
panic = "abort"

[profile.release]
strip = false
debug = true
panic = "abort"
opt-level = "z"
lto = true
